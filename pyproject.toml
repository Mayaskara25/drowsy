[project]
name = "drowsy"
version = "0.1.0"
description = "Commercial Vehicle Safety Platform V1 - driver fatigue detection: camera → perception → temporal fatigue → alert → event → fleet"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "sqlmodel>=0.0.16",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/drowsy"]
